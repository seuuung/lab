<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T0XQB053HX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-T0XQB053HX');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101c25">
    <meta name="description" content="출구만 찾는 탐험 모드와 괴물을 피해 탈출하는 추격 모드를 즐기는 3D 미로 게임">
    <title>Maze Runner — 미로 탐험</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>

<body>
    <!-- 실험실 홈으로 돌아가기 표준 플로팅 버튼 -->
    <a href="../../index.html" class="floating-home-btn" aria-label="실험실 홈으로 이동">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>실험실 홈</span>
    </a>

    <div id="crosshair">
        <div class="ch-line horizontal"></div>
        <div class="ch-line vertical"></div>
    </div>

    <div id="hud" aria-label="탐험 정보">
        <div class="hud-title"><span class="hud-emblem" aria-hidden="true">◇</span><span>MAZE <strong>RUNNER</strong></span></div>
        <div class="hud-objective"><span class="objective-dot" aria-hidden="true"></span><span id="objective-text">출구 문을 찾으세요</span></div>
        <div class="hud-timer"><span>탐험 시간</span><strong id="timer-display" class="orbitron">00:00</strong></div>
    </div>

    <!-- 모바일 터치 UI 레이어 -->
    <div id="mobile-ui">
        <div id="look-zone" class="touch-zone">
            <span class="look-hint">화면을 밀어 둘러보기</span>
        </div>
        <div id="joystick-zone" class="touch-zone" aria-label="이동 조이스틱">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
            </div>
            <span class="control-label">이동</span>
        </div>
        <button id="action-btn" type="button" aria-label="마커 칠하기 또는 지우기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M12.5 2a2.5 2.5 0 0 0-2.5 2.5V7H8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-2V4.5A2.5 2.5 0 0 0 12.5 2zM7 12v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-8H7zm4 2h2v5h-2v-5z" />
            </svg>
            <span>마커</span>
        </button>
    </div>

    <div id="blocker">
        <div id="instructions">
            <span class="panel-kicker">THE LOST LABYRINTH · 01</span>
            <div class="panel-emblem" aria-hidden="true">◇</div>
            <h1 class="orbitron">MAZE RUNNER</h1>
            <p class="panel-lede">길을 기억하고, 흔적을 남기며 출구를 찾으세요.</p>
            <div class="mode-picker" role="group" aria-label="게임 모드 선택">
                <button class="mode-option selected" type="button" data-mode="explore" aria-pressed="true"><strong>◇ 탐험</strong><span>넓은 미로 · 괴물 없음</span></button>
                <button class="mode-option" type="button" data-mode="chase" aria-pressed="false"><strong>◆ 추격</strong><span>작은 미로 · 괴물 추격</span></button>
            </div>
            <div id="desktop-desc">
                <div class="instruction-list">
                    <div><span class="key-group"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></span><span>이동</span></div>
                    <div><span class="key-group">마우스</span><span>시점 회전</span></div>
                    <div><span class="key-group">좌클릭</span><span>벽에 마커 칠하기 · 지우기</span></div>
                </div>
            </div>
            <div id="mobile-desc">
                <div class="instruction-list">
                    <div><span class="key-group">왼쪽 원</span><span>이동</span></div>
                    <div><span class="key-group">화면 밀기</span><span>시점 회전</span></div>
                    <div><span class="key-group">마커 버튼</span><span>벽에 흔적 남기기 · 지우기</span></div>
                </div>
            </div>
            <button id="start-button" type="button" class="primary-button">탐험 시작 <span aria-hidden="true">→</span></button>
            <p class="panel-footnote">출구라고 적힌 문에 다가가면 탈출합니다</p>
        </div>
    </div>

    <div id="win-screen">
        <div class="win-panel">
            <span id="result-kicker" class="panel-kicker">THE LOST LABYRINTH · COMPLETE</span>
            <div class="panel-emblem win-emblem" aria-hidden="true">✦</div>
            <h1 id="result-title" class="orbitron glow-text">탈출 성공!</h1>
            <p id="result-description" class="panel-lede">길을 찾아 미로를 빠져나왔습니다.</p>
            <div class="result-time"><span>탐험 시간</span><strong id="final-time" class="orbitron">00:00</strong></div>
            <button class="primary-button" type="button" onclick="resetGame()">새 미로 · 모드 선택 <span aria-hidden="true">→</span></button>
        </div>
    </div>

    <script src="chase_rules.js"></script>
    <script src="game.js?v=6"></script>
</body>

</html>
