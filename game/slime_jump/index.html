<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T0XQB053HX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-T0XQB053HX');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8dc8ef">
    <title>쫀득쫀득 슬라임 점프</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../index.html" class="floating-home-btn" aria-label="실험실 홈으로 이동">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>실험실 홈</span>
    </a>

    <div id="ui-layer" aria-live="polite">
        <div class="score-card">
            <span class="score-label">ALTITUDE</span>
            <strong><span id="scoreText">0</span><small>m</small></strong>
        </div>
        <div class="score-card seed-card">
            <span class="score-label">별씨앗</span>
            <strong>✦ <span id="seedText">0</span></strong>
        </div>
        <div class="score-card best-card">
            <span class="score-label">BEST</span>
            <strong><span id="highScoreText">0</span><small>m</small></strong>
        </div>
    </div>

    <canvas id="gameCanvas" aria-label="떠 있는 섬 사이를 점프하는 슬라임 게임"></canvas>
    <div id="play-hint"><span id="abilityText">준비 완료</span><span id="gameStatus" aria-live="polite">다음 섬을 향해 점프!</span></div>

    <div id="startScreen" class="overlay">
        <div class="overlay-card w-[85%]">
            <span class="eyebrow">A LITTLE SKY ADVENTURE</span>
            <h1>SLIME<br><em>JUMP!</em></h1>
            <p>통통 튀는 슬라임과 함께<br>구름 위 섬을 차례로 건너보세요.</p>
            <div class="how-to">
                <span class="gesture-icon" aria-hidden="true">↗</span>
                <span><b>당겨서 점프 · 공중에서 한 번 더 탭</b><br>마우스 드래그도 가능해요 · 방향키 + 스페이스</span>
            </div>
            <div class="mechanics" aria-label="섬 종류와 아이템">
                <span><i class="spring-dot"></i> 높이 뛰는 섬</span>
                <span><i class="fragile-dot"></i> 무너지는 섬</span>
                <span><i class="moving-dot"></i> 움직이는 섬</span>
                <span><i class="seed-dot"></i> 도약 충전 씨앗</span>
            </div>
            <button id="startBtn" class="play-button min-h-[44px] px-10 py-4">모험 시작하기 <span aria-hidden="true">→</span></button>
        </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <div class="overlay-card result-card w-[85%]">
            <span class="eyebrow">ONE MORE JUMP?</span>
            <h2>아직 더 높이<br>갈 수 있어요!</h2>
            <p>섬을 놓쳐도 다음 도전이 기다려요.</p>
            <div class="result-score">
                <div><span>이번 기록</span><strong><span id="finalScore">0</span>m</strong></div>
                <div><span>최고 기록</span><strong><span id="finalHighScore">0</span>m</strong></div>
                <div class="seed-result"><span>모은 별씨앗</span><strong>✦ <span id="finalSeeds">0</span></strong></div>
            </div>
            <button id="restartBtn" class="play-button min-h-[44px] px-10 py-4">다시 도전하기 <span aria-hidden="true">↗</span></button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
