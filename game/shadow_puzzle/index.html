<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shadow Puzzle (섀도우 퍼즐) - 승민's 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-950 select-none overflow-hidden touch-none font-['Outfit','Noto_Sans_KR',sans-serif]">

    <!-- Top Integrated Navigation Bar (모바일 완벽 대응) -->
    <header class="top-nav-bar">
        <!-- Left: Home Button -->
        <a href="../../index.html" class="top-btn hover:text-cyan-400 group" aria-label="실험실 홈으로 이동">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="hidden sm:inline">실험실 홈</span>
            <span class="sm:hidden">홈</span>
        </a>

        <!-- Center: Level Selector -->
        <button id="level-select-btn" class="top-btn level-selector-btn" aria-label="레벨 선택 목록 열기">
            <span id="level-badge" class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span id="level-text" class="text-white whitespace-nowrap">레벨 1 / 18</span>
            <svg class="w-3 h-3 text-cyan-300 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
        </button>

        <!-- Right: Tool Actions (Hint, Sound, Reset) -->
        <div class="flex items-center gap-1.5 sm:gap-2">
            <!-- Hint Button -->
            <button id="hint-btn" class="top-btn icon-btn text-yellow-300 hover:text-yellow-200 border-yellow-500/30 hover:border-yellow-400/60 shadow-lg" title="💡 힌트 보기 (목표 형상 실루엣)" aria-label="힌트 보기">
                <span class="text-base sm:text-lg">💡</span>
            </button>

            <!-- Sound Toggle Button -->
            <button id="sound-btn" class="top-btn icon-btn text-slate-300 hover:text-white" title="효과음 켜기/끄기" aria-label="효과음 토글">
                <span id="sound-icon" class="text-sm sm:text-base">🔊</span>
            </button>

            <!-- Reset Angle Button -->
            <button id="reset-btn" class="top-btn icon-btn text-slate-300 hover:text-white" title="각도 다시 섞기" aria-label="각도 리셋">
                <span class="text-sm sm:text-base">🔄</span>
            </button>
        </div>
    </header>

    <!-- 💡 콤팩트 목표 형상 힌트 프리뷰 카드 (줄바꿈 없이 한눈에 인식) -->
    <div id="hint-card-panel" class="hint-card-panel">
        <div class="flex items-center justify-between w-full gap-3 px-1">
            <div class="flex items-center gap-1.5 text-xs font-bold whitespace-nowrap overflow-hidden">
                <span class="text-yellow-400 text-sm">💡</span>
                <span class="text-yellow-300/80">목표:</span>
                <span id="hint-level-name" class="text-white font-extrabold truncate max-w-[130px] sm:max-w-[160px]">하트</span>
            </div>
            <button id="close-hint-btn" class="w-5 h-5 flex-shrink-0 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white text-xs flex items-center justify-center transition-colors" aria-label="힌트 닫기">✕</button>
        </div>
        <canvas id="hint-preview-canvas" width="110" height="110"></canvas>
        <span class="text-[9.5px] text-slate-400 whitespace-nowrap">벽면 그림자를 위 형상으로 맞추세요</span>
    </div>

    <!-- Bottom HUD & Proximity Meter -->
    <div class="fixed bottom-[max(1.2rem,env(safe-area-inset-bottom,1.2rem))] left-0 w-full flex flex-col items-center justify-end z-20 pointer-events-none gap-2.5 px-4">
        
        <!-- Live Proximity Gauge -->
        <div id="proximity-container" class="pointer-events-auto flex flex-col items-center gap-1 transition-all duration-300 opacity-90">
            <div class="flex items-center justify-between w-full max-w-[220px] px-1 text-[11px] font-semibold text-slate-400">
                <span class="flex items-center gap-1">
                    <span id="proximity-dot" class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                    <span id="proximity-label">그림자 일치율</span>
                </span>
                <span id="proximity-pct" class="font-mono text-cyan-300 font-bold">0%</span>
            </div>
            <div class="proximity-meter-container">
                <div id="proximity-bar" class="proximity-meter-bar"></div>
            </div>
        </div>

        <!-- Dynamic Instruction Banner -->
        <div id="instruction-card" class="pointer-events-auto glass-panel px-5 py-2 sm:px-6 sm:py-2.5 rounded-full shadow-2xl transition-all duration-300 text-center max-w-md">
            <p id="instruction" class="text-xs sm:text-sm font-medium text-slate-200">
                3D 블록을 드래그하여 벽면의 그림자 형상을 맞춰보세요!
            </p>
        </div>

        <!-- Next Level Button -->
        <div id="next-btn-container" class="h-0 overflow-hidden opacity-0 transition-all duration-500 ease-out flex justify-center pointer-events-auto">
            <button id="next-btn" class="min-h-[46px] bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-extrabold text-sm py-2.5 px-7 rounded-full shadow-xl shadow-cyan-500/30 transform transition-all duration-200 hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                <span>다음 레벨로 이동</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </button>
        </div>
    </div>

    <!-- Level Select Modal -->
    <div id="level-modal" class="fixed inset-0 modal-backdrop hidden flex-col items-center justify-center z-40 pointer-events-auto p-4 transition-all duration-300">
        <div class="glass-panel w-full max-w-xl rounded-3xl p-5 sm:p-7 flex flex-col gap-4 scale-in border border-slate-700/60 shadow-2xl">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="text-2xl">🧩</span>
                    <h2 class="text-lg sm:text-xl font-bold text-white">레벨 선택 (총 18개 스테이지)</h2>
                </div>
                <button id="close-level-modal" class="w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center font-bold text-base transition-colors" aria-label="닫기">
                    ✕
                </button>
            </div>
            <p class="text-slate-400 text-xs">플레이하고 싶은 스테이지를 선택하세요.</p>
            
            <div id="level-grid" class="grid grid-cols-3 sm:grid-cols-6 gap-2.5 max-h-[55vh] overflow-y-auto pr-1">
                <!-- Level Cards dynamically injected -->
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-800 text-xs text-slate-400">
                <span>클리어 진행도: <strong id="cleared-count" class="text-emerald-400">0 / 18</strong></span>
                <button id="reset-progress-btn" class="text-slate-500 hover:text-rose-400 underline transition-colors">진행도 초기화</button>
            </div>
        </div>
    </div>

    <!-- All Clear Ending Modal -->
    <div id="ending-modal" class="fixed inset-0 modal-backdrop hidden flex-col items-center justify-center z-40 pointer-events-auto p-4 transition-all duration-300">
        <div class="glass-panel w-full max-w-md rounded-3xl p-8 text-center flex flex-col items-center gap-5 scale-in border border-cyan-500/30 shadow-[0_0_50px_rgba(6,182,212,0.25)]">
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 to-amber-500 flex items-center justify-center text-4xl shadow-lg shadow-amber-500/40 animate-bounce">
                🏆
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">모든 레벨 마스터!</h1>
                <p class="text-slate-300 text-xs sm:text-sm leading-relaxed">
                    당신의 뛰어난 공간 지각 능력으로<br>18개의 모든 그림자 비밀을 완벽하게 풀어냈습니다!
                </p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 w-full justify-center pt-2">
                <button id="restart-btn" class="min-h-[44px] flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-6 rounded-full shadow-lg shadow-cyan-500/30 transform transition-transform hover:scale-105 active:scale-95">
                    처음부터 다시 하기
                </button>
                <a href="../../index.html" class="min-h-[44px] flex-1 top-btn py-3 px-6 rounded-full text-slate-300 hover:text-white font-semibold flex items-center justify-center">
                    실험실로 복귀
                </a>
            </div>
        </div>
    </div>

    <!-- 3D WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <script src="script.js"></script>
</body>

</html>
